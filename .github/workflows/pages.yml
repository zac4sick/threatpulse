name: Refresh & publish ThreatPulse

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 minutes (GitHub may start runs a few minutes late)
  workflow_dispatch:         # Actions tab -> "Run workflow" for a manual refresh
  push:
    branches: [main]

# Least privilege: no workflow-wide permissions. The build job can only read the code and
# is the only place secrets exist; the deploy job has no secrets and can only publish Pages.
# Every action is pinned to a full commit SHA (tags can be moved; SHAs can't). Dependabot bumps them.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # don't leave the GITHUB_TOKEN in .git/config

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Load previous data from the live site (keeps history + fallback data)
        run: |
          mkdir -p data
          curl -fsS --proto '=https' --max-time 30 \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data.json" -o data/data.json \
            || echo "no previous data (first run)"

      - name: Fetch, score and summarise
        env:   # secrets are scoped to this one step only
          DATA_PATH: data/data.json
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_URL: ${{ vars.LLM_API_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCHLIST: ${{ vars.WATCHLIST }}
          WATCH_SITES: ${{ vars.WATCH_SITES }}
        run: python3 -I -m app.cli

      - name: Check the published data contains no secrets
        env:
          S1: ${{ secrets.NVD_API_KEY }}
          S2: ${{ secrets.ABUSECH_AUTH_KEY }}
          S3: ${{ secrets.ANTHROPIC_API_KEY }}
          S4: ${{ secrets.LLM_API_KEY }}
          S5: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          for v in "$S1" "$S2" "$S3" "$S4" "$S5"; do
            if [ -n "$v" ] && grep -qF -- "$v" data/data.json; then echo "::error::a secret value appears in data.json"; exit 1; fi
          done
          echo "no secret values in data.json"

      - name: Assemble site (SRI hashes, cache-busting, security.txt)
        run: python3 -I scripts/build_site.py data/data.json _site

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
