name: Tests

on:
  push:
    branches: [main]
  pull_request:          # runs without access to secrets, by GitHub design
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install test dependencies (hash-pinned)
        run: python3 -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python3 -m pytest -q
      - name: Build the site the same way production does
        run: |
          echo '{}' > /tmp/data.json
          python3 -I scripts/build_site.py /tmp/data.json /tmp/_site
