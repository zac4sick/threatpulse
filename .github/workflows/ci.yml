name: Tests

on:
  push:
    branches: [main]
  pull_request:          # runs without access to secrets, by GitHub design
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies (hash-pinned)
        run: python3 -m pip install --require-hashes -r requirements-dev.txt
      - name: Run tests
        run: python3 -m pytest -q
      - name: Build the site the same way production does
        run: |
          echo '{}' > /tmp/data.json
          python3 -I scripts/build_site.py /tmp/data.json /tmp/_site
